<article class="group bg-gray-900 rounded-xl overflow-hidden border border-gray-800 hover:border-cyan-500/50 transition-all duration-300 hover:shadow-lg hover:shadow-cyan-500/10 focus-within:ring-2 focus-within:ring-cyan-500 min-h-64 max-h-[450px] h-full">
    <div class="relative h-40 overflow-hidden article-image">
        <img
            [src]="articleData().image"
            alt=""
            loading="lazy"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-900/80 to-transparent"></div>
        <app-chip [label]="'Featured'" />
    </div>
    <div class="p-4">
        <div class="flex items-center gap-2 mb-2">
            <img [src]="articleData().user_image" alt="{{ articleData().user }}" class="w-6 h-6 rounded-full">
            <span class="text-xs text-gray-400 font-medium">{{ articleData().user }} • <time datetime="2025-12-22T10:00:00">{{ articleData().created_at | date:'dd/MM/yyyy' }}</time></span>
        </div>
        <h3 class="text-base font-bold text-gray-100 mb-2 leading-tight line-clamp-2 group-hover:text-cyan-400 transition-colors">
            <a [href]="articleData().url" target="_blank" rel="noopener noreferrer" class="focus:outline-none focus:underline">
                {{ articleData().title }}
            </a>
        </h3>
        <div class="flex flex-wrap gap-1.5 mb-3">
            @for (tag of articleData().tag_list; track tag) {
                <span class="px-2 py-0.5 bg-cyan-500/10 text-cyan-400 rounded text-xs font-semibold">#{{tag}}</span>
            }
        </div>
        <div class="flex items-center justify-between text-xs text-gray-400 pt-3 border-t border-gray-800">
            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    {{ articleData().positive_reactions_count }}
                </span>
                <span class="flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                    {{ articleData().public_reactions_count }}
                </span>
            </div>
            <span class="font-medium">{{ articleData().reading_time_minutes }} min</span>
        </div>
    </div>
</article>
