@for (item of Array(count()); track $index) {
<article class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800 min-h-64 max-h-[450px] h-full animate-pulse">
    <div class="relative h-40 overflow-hidden bg-gray-800"></div>
    <div class="p-4">
        <div class="flex items-center gap-2 mb-2">
            <div class="w-6 h-6 rounded-full bg-gray-800"></div>
            <div class="h-3 w-32 bg-gray-800 rounded"></div>
        </div>
        <div class="h-4 bg-gray-800 rounded mb-2"></div>
        <div class="h-4 bg-gray-800 rounded w-3/4 mb-3"></div>
        <div class="flex flex-wrap gap-1.5 mb-3">
            <div class="h-5 w-16 bg-gray-800 rounded"></div>
            <div class="h-5 w-20 bg-gray-800 rounded"></div>
            <div class="h-5 w-14 bg-gray-800 rounded"></div>
        </div>
        <div class="flex items-center justify-between pt-3 border-t border-gray-800">
            <div class="flex items-center gap-3">
                <div class="h-4 w-8 bg-gray-800 rounded"></div>
                <div class="h-4 w-8 bg-gray-800 rounded"></div>
            </div>
            <div class="h-4 w-12 bg-gray-800 rounded"></div>
        </div>
    </div>
</article>
}
